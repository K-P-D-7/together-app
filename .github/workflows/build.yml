name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Same signing key every build, so new versions install over old ones.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "REAL_CONFIG=1" >> $GITHUB_ENV
          else
            echo '{"project_info":{"project_number":"1","project_id":"dummy","firebase_url":"https://dummy-default-rtdb.firebaseio.com","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"com.kishan.together"}},"api_key":[{"current_key":"x"}]}],"configuration_version":"1"}' > app/google-services.json
          fi

      - run: gradle assembleDebug --no-daemon

      - name: Publish release
        if: env.REAL_CONFIG == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Together.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Together.apk --title "Together" --notes "Download Together.apk and install it."
